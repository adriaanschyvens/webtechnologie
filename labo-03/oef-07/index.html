<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oefening 3.7</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Dataverkeer</h1>
    <table class="w-full border-collapse">
      <caption class="text-left text-gray-600 mb-2">
        Dataverkeer van het netwerklab (in TB)
      </caption>
      <thead class="bg-gray-800 text-white">
        <tr>
          <th
            rowspan="2"
            scope="col"
            class="border border-gray-300 px-4 py-2 textcenter"
          >
            Jaar
          </th>
          <th
            colspan="2"
            scope="colgroup"
            class="border border-gray-300 px-4 py-2 text-center"
          >
            Dataverkeer
          </th>
        </tr>
        <tr>
          <th scope="col" class="border border-gray-300 px-4 py-2 textcenter">
            Inkomend
          </th>
          <th scope="col" class="border border-gray-300 px-4 py-2 textcenter">
            Uitgaand
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 text-left">
            2022
          </th>
          <td class="border border-gray-300 px-4 py-2 text-right">12,4</td>
          <td class="border border-gray-300 px-4 py-2 text-right">8,1</td>
        </tr>
        <tr class="bg-gray-50">
          <th scope="row" class="border border-gray-300 px-4 py-2 text-left">
            2023
          </th>
          <td class="border border-gray-300 px-4 py-2 text-right">15,9</td>
          <td class="border border-gray-300 px-4 py-2 text-right">10,3</td>
        </tr>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 text-left">
            2024
          </th>
          <td class="border border-gray-300 px-4 py-2 text-right">21,2</td>
          <td class="border border-gray-300 px-4 py-2 text-right">14,8</td>
        </tr>
        <tr class="bg-gray-50">
          <th scope="row" class="border border-gray-300 px-4 py-2 text-left">
            2025
          </th>
          <td class="border border-gray-300 px-4 py-2 text-right">27,6</td>
          <td class="border border-gray-300 px-4 py-2 text-right">19,5</td>
        </tr>
      </tbody>
      <tfoot>
        <tr class="font-bold">
          <th scope="row" class="border border-gray-300 px-4 py-2 textleft">
            Totaal
          </th>
          <td class="border border-gray-300 px-4 py-2 text-right">77,1</td>
          <td class="border border-gray-300 px-4 py-2 text-right">52,7</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
