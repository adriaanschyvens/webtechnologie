<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oefening 3.6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Switches vergelijken</h1>
    <table class="w-full border-collapse">
      <caption class="text-left text-gray-600 mb-2">
        Drie switches voor het netwerklab
      </caption>
      <thead class="bg-gray-800 text-white">
        <tr>
          <th scope="col" class="border border-gray-300 px-4 py-2 text-left">
            &nbsp;
          </th>
          <th scope="col" class="border border-gray-300 px-4 py-2 text-left">
            Basic 8<br />&euro; 35
          </th>
          <th scope="col" class="border border-gray-300 px-4 py-2 text-left">
            Office 24<br />&euro; 190
          </th>
          <th scope="col" class="border border-gray-300 px-4 py-2 text-left">
            Pro 48<br />&euro; 420
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 textleft">
            Poorten
          </th>
          <td class="border border-gray-300 px-4 py-2">8</td>
          <td class="border border-gray-300 px-4 py-2">24</td>
          <td class="border border-gray-300 px-4 py-2">48</td>
        </tr>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 textleft">
            Snelheid
          </th>
          <td class="border border-gray-300 px-4 py-2">1 Gbit/s</td>
          <td class="border border-gray-300 px-4 py-2">1 Gbit/s</td>
          <td class="border border-gray-300 px-4 py-2">10 Gbit/s</td>
        </tr>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 text-left">
            PoE
          </th>
          <td class="border border-gray-300 px-4 py-2">nee</td>
          <td class="border border-gray-300 px-4 py-2">ja</td>
          <td class="border border-gray-300 px-4 py-2">ja</td>
        </tr>
        <tr>
          <th scope="row" class="border border-gray-300 px-4 py-2 textleft">
            VLAN's
          </th>
          <td class="border border-gray-300 px-4 py-2">nee</td>
          <td class="border border-gray-300 px-4 py-2">ja</td>
          <td class="border border-gray-300 px-4 py-2">ja</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
